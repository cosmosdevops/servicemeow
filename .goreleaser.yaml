# Builds release binaries and publishes the GitHub release for a version tag.
# Container images are built by .github/workflows/build-container.yml.
version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/CosmosDevops/servicemeow/cmd.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
  footer: |
    ## Container image

    ```
    docker pull ghcr.io/cosmosdevops/servicemeow:{{ .Version }}
    ```
