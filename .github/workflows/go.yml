name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

    - name: Build
      run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -v .

    - name: Pack
      run: |
        sudo apt-get update && sudo apt-get install -y upx-ucl
        upx servicemeow

    - name: Save executable
      uses: actions/upload-artifact@v7
      with:
        name: servicemeow
        path: servicemeow
